<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101218">

  <title>TV Memory</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101218;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 24px 18px 100px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #7c8cff;
    }

    .add-button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #7c8cff;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    h2 {
      font-size: 14px;
      letter-spacing: 1.5px;
      color: #9da3b4;
      margin-bottom: 14px;
    }

    .card {
      background: #1a1d26;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .show-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .platform {
      color: #9da3b4;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .episode {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .watched-button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 12px;
      background: #7c8cff;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .empty {
      color: #73798a;
      text-align: center;
      padding: 30px 10px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: #171920;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #292c36;
    }

    nav div {
      text-align: center;
      color: #8d93a4;
      font-size: 12px;
    }

    nav .active {
      color: #8c99ff;
    }

    .nav-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">TV <span>Memory</span></div>
      <button class="add-button" onclick="addShow()">+</button>
    </header>

    <h2>UP NEXT</h2>

    <div id="showList">

      <div class="card">
        <div class="show-name">Welcome to TV Memory</div>
        <div class="platform">Your personal TV tracker</div>
        <div class="episode">
          Add the shows you're watching and TV Memory will remember where you left off.
        </div>
        <button class="watched-button" onclick="addShow()">
          + ADD YOUR FIRST SHOW
        </button>
      </div>

    </div>

    <h2 style="margin-top:30px;">WAITING FOR NEW EPISODES</h2>

    <div class="empty">
      Shows you're caught up on will appear here.
    </div>

  </div>

  <nav>
    <div class="active">
      <span class="nav-icon">▶</span>
      Up Next
    </div>

    <div>
      <span class="nav-icon">▦</span>
      My Shows
    </div>

    <div>
      <span class="nav-icon">●</span>
      New
    </div>

    <div>
      <span class="nav-icon">✓</span>
      Finished
    </div>
  </nav>

  <script>
    function addShow() {
      alert("Show search is coming next!");
    }
  </script>

</body>
</html>
